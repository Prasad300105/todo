<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List Manager</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>📝 To-Do List Manager</h1>

        <p class="subtitle">
            Organize your daily tasks easily!
        </p>

        <!-- Add Task -->
        <form action="{{ url_for('add_task') }}" method="POST" class="task-form">

            <input type="text" name="task" placeholder="Enter your task..." required>

            <button type="submit">+ Add Task</button>

        </form>

        <h2>My Tasks</h2>

        <!-- Display Tasks -->
        <div class="task-list">

            {% if tasks %} {% for task in tasks %}

            <div class="task-item">

                <span>{{ loop.index }}. {{ task }}</span>

                <div class="actions">

                    <!-- Edit Button -->
                    <a href="{{ url_for('edit_task', index=loop.index0) }}" class="edit-btn">
                            Edit
                        </a>

                    <!-- Delete Button -->
                    <form action="{{ url_for('delete_task', index=loop.index0) }}" method="POST" class="delete-form" onsubmit="return confirm('Are you sure you want to delete this task?')">

                        <button type="submit" class="delete-btn">
                                Delete
                            </button>

                    </form>

                </div>

            </div>

            {% endfor %} {% else %}

            <p class="empty">
                No tasks available. Add your first task!
            </p>

            {% endif %}

        </div>

        <!-- Task Counter -->
        <div class="task-count">
            Total Tasks: {{ tasks|length }}
        </div>

    </div>

</body>

</html>
