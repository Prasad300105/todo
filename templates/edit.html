<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>✏️ Edit Task</h1>

        <p class="subtitle">
            Update your existing task
        </p>

        <!-- Edit Form -->
        <form action="{{ url_for('edit_task', index=index) }}" method="POST" class="edit-form">

            <input type="text" name="task" value="{{ task }}" required autofocus> {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <button type="submit" class="save-btn">
                Save Changes
            </button>

            <a href="{{ url_for('home') }}" class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>
